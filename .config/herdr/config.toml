onboarding = false

[keys]
prefix = "ctrl+space"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"


[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[ui.toast]
delivery = "herdr"

[experimental]
kitty_graphics = true
pane_history = true
switch_ascii_input_source_in_prefix = true
